<!DOCTYPE html>
<html>
<head>
    <title>Symptoms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .disease {
            display: inline-block;
            padding: 5px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }

        .disease:hover {
            background-color: #e6f7ff;
        }
    </style>
</head>

<body>

<p>Click on a symptom to copy it to the clipboard:</p>

<div id="symptom-container"></div>

<script>

fetch("/get_symptoms")
.then(response => response.json())
.then(data => {

    let container = document.getElementById("symptom-container");

    data.forEach(symptom => {

        let div = document.createElement("div");
        div.className = "disease";
        div.innerText = symptom.replace(/_/g, " ");

        div.onclick = () => copyToClipboard(symptom);

        container.appendChild(div);

    });

});

function copyToClipboard(text) {

    navigator.clipboard.writeText(text);

    let message = document.createElement("div");
    message.innerHTML = "Copied: " + text;
    message.style.cssText =
    "background-color:#4CAF50;color:white;font-size:16px;padding:12px;position:fixed;bottom:20px;right:20px;z-index:9999;opacity:0;transition:opacity 0.2s;";

    document.body.appendChild(message);

    setTimeout(()=> message.style.opacity=1,100);
    setTimeout(()=>{
        message.style.opacity=0;
        setTimeout(()=>document.body.removeChild(message),200);
    },2000);
}

</script>

</body>
</html>
